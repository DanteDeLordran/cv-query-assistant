version = "0.1.0"
description = "CV analyzer, summarizer and question assisstant for HR personal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.1.3",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "markitdown[pdf,pptx,txt]>=0.1.4",
    "pymupdf4llm>=0.2.7",
    "torch>=2.9.1",
    "typer>=0.20.0",
]
